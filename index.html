<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏛️ Dashboard Immobilier Marseille 2025</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:#f0f2f5; }
    #map { height:100vh; width:100%; position:absolute; top:0; left:0; z-index:0; }
    #controls {
      position:absolute; top:20px; right:20px; z-index:1000;
      background:rgba(255,255,255,0.96); padding:18px 22px; border-radius:14px;
      box-shadow:0 8px 30px rgba(0,0,0,0.22); min-width:240px; max-height:92vh; overflow-y:auto;
    }
    #controls label { display:block; font-weight:700; color:#1a3b5d; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.6px; margin:12px 0 4px 0; }
    #controls label:first-of-type { margin-top:0; }
    #controls select { width:100%; padding:8px 12px; border-radius:8px; border:1px solid #d0d7de; font-size:0.9rem; background:#fafbfc; }
    .ctrl-hint { font-size:0.7rem; color:#6b7a8a; margin-top:2px; }
    .ctrl-divider { border:none; border-top:1px solid #e9edf2; margin:12px 0; }
    #legend-container {
      position:absolute; bottom:30px; right:20px; z-index:1000;
      background:rgba(255,255,255,0.95); padding:14px 18px; border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.13); border-left:5px solid #2a6f97;
      display:none; font-size:0.82rem; max-height:55vh; overflow-y:auto; min-width:140px;
    }
    #legend-container h4 { margin:0 0 8px 0; font-size:0.85rem; color:#1a3b5d; }
    .legend-item { display:flex; align-items:center; gap:10px; margin:4px 0; }
    .color-box { width:20px; height:20px; border-radius:4px; border:1px solid #bbb; flex-shrink:0; }
    #loading {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:2000;
      background:rgba(0,0,0,0.78); color:#fff; padding:20px 40px; border-radius:60px;
      display:flex; align-items:center; gap:18px; font-size:1.1rem;
      backdrop-filter:blur(4px);
    }
    .spinner { width:24px; height:24px; border:3px solid rgba(255,255,255,0.25); border-top:3px solid #fff; border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #error-msg {
      position:absolute; top:80px; left:50%; transform:translateX(-50%); z-index:1500;
      background:#dc3545; color:#fff; padding:12px 28px; border-radius:10px; display:none;
      text-align:center; max-width:85%; box-shadow:0 6px 18px rgba(0,0,0,0.2); font-weight:500;
    }
    #error-msg code { background:rgba(0,0,0,0.2); padding:2px 6px; border-radius:4px; font-size:0.85em; }
    .leaflet-popup-content { font-size:0.85rem; min-width:220px; max-width:300px; }
    .popup-row { display:flex; justify-content:space-between; padding:2px 0; gap:12px; }
    .popup-row .label { color:#4a5d6e; }
    .popup-row .value { font-weight:600; color:#0b2a41; text-align:right; }
    #kpi-panel {
      position:absolute; bottom:20px; left:20px; z-index:1000;
      background:rgba(255,255,255,0.95); padding:14px 20px; border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.13); backdrop-filter:blur(4px);
      grid-template-columns:repeat(4,auto); gap:20px 30px;
      font-size:0.9rem; border-left:5px solid #2a6f97; display:none;
    }
    #kpi-panel .kpi-item { display:flex; flex-direction:column; }
    #kpi-panel .kpi-label { font-size:0.65rem; text-transform:uppercase; color:#6b7a8a; letter-spacing:0.5px; }
    #kpi-panel .kpi-value { font-size:1.3rem; font-weight:700; color:#1a3b5d; }
    #graph-panel {
      position:absolute; bottom:100px; left:20px; z-index:1000;
      background:rgba(255,255,255,0.95); padding:16px 20px; border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.13); backdrop-filter:blur(4px);
      width:400px; max-height:45vh; overflow-y:auto; display:none; border-left:5px solid #2a6f97;
    }
    #graph-panel h4 { margin:0 0 10px 0; color:#1a3b5d; font-size:0.9rem; }
    #graph-panel canvas { width:100% !important; height:auto !important; max-height:180px; }
    @media (max-width:768px) {
      #controls { min-width:160px; padding:12px 14px; top:10px; right:10px; }
      #kpi-panel { grid-template-columns:repeat(2,auto); gap:10px 20px; padding:12px 16px; bottom:10px; left:10px; }
      #graph-panel { width:280px; left:10px; bottom:80px; padding:12px 16px; }
    }
  </style>
</head>
<body>

  <div id="loading"><div class="spinner"></div><span>Chargement des données…</span></div>
  <div id="error-msg"></div>
  <div id="map"></div>

  <div id="controls">
    <label for="arrSelect">🗺️ Arrondissement</label>
    <select id="arrSelect">
      <option value="all">Tous</option>
      <option value="13201">13001 – Marseille 1er</option>
      <option value="13202">13002 – Marseille 2e</option>
      <option value="13203">13003 – Marseille 3e</option>
      <option value="13204">13004 – Marseille 4e</option>
      <option value="13205">13005 – Marseille 5e</option>
      <option value="13206">13006 – Marseille 6e</option>
      <option value="13207">13007 – Marseille 7e</option>
      <option value="13208">13008 – Marseille 8e</option>
      <option value="13209">13009 – Marseille 9e</option>
      <option value="13210">13010 – Marseille 10e</option>
      <option value="13211">13011 – Marseille 11e</option>
      <option value="13212">13012 – Marseille 12e</option>
      <option value="13213">13013 – Marseille 13e</option>
      <option value="13214">13014 – Marseille 14e</option>
      <option value="13215">13015 – Marseille 15e</option>
      <option value="13216">13016 – Marseille 16e</option>
    </select>
    <div class="ctrl-hint">Affiche les parcelles et les transactions immobilières</div>
    <hr class="ctrl-divider" />
    <div class="ctrl-hint" style="margin-top:6px;">
      <span id="parcelleCount" style="font-weight:600;">0</span> parcelles affichées
    </div>
  </div>

  <div id="legend-container">
    <h4>Légende</h4>
    <div class="legend-item"><div class="color-box" style="background:#9e9e9e;"></div><span>Parcelle cadastrale</span></div>
    <div class="legend-item"><div class="color-box" style="background:#e74c3c; border-radius:50%; width:12px; height:12px;"></div><span>Transaction immobilière</span></div>
  </div>

  <div id="kpi-panel">
    <div class="kpi-item"><span class="kpi-label">Prix moyen / m²</span><span class="kpi-value" id="kpi-prix-m2">—</span></div>
    <div class="kpi-item"><span class="kpi-label">Transactions</span><span class="kpi-value" id="kpi-transactions">—</span></div>
    <div class="kpi-item"><span class="kpi-label">Surface moyenne</span><span class="kpi-value" id="kpi-surface">—</span></div>
    <div class="kpi-item"><span class="kpi-label">Prix médian</span><span class="kpi-value" id="kpi-prix-median">—</span></div>
  </div>

  <div id="graph-panel">
    <h4 id="graph-title">📊 Prix au m² par arrondissement</h4>
    <canvas id="chart-prix-m2"></canvas>
  </div>

  <script>
    // ================================================================
    // ⚙️ CONFIGURATION — Modifie cette ligne pour changer de source
    // ================================================================
    // '' (vide)              → fichiers locaux dans data/
    // 'https://...r2.dev'    → Cloudflare R2
    // 'https://cdn.jsdelivr.net/gh/gunout/marseille-data@main'  → jsDelivr
    const CDN_BASE = '';

    // ================================================================
    // 1. DONNÉES IMMOBILIÈRES MARSEILLE (statistiques DVF simulées)
    // ================================================================
    const STATS_ARRONDISSEMENTS = {
      '13201': { nom: 'Marseille 1er',  prix_m2_moyen: 2850, nb_transactions: 290, surface_moyenne: 46, prix_median: 135000 },
      '13202': { nom: 'Marseille 2e',   prix_m2_moyen: 2650, nb_transactions: 320, surface_moyenne: 44, prix_median: 118000 },
      '13203': { nom: 'Marseille 3e',   prix_m2_moyen: 2100, nb_transactions: 380, surface_moyenne: 50, prix_median: 105000 },
      '13204': { nom: 'Marseille 4e',   prix_m2_moyen: 2450, nb_transactions: 350, surface_moyenne: 52, prix_median: 128000 },
      '13205': { nom: 'Marseille 5e',   prix_m2_moyen: 2900, nb_transactions: 410, surface_moyenne: 55, prix_median: 160000 },
      '13206': { nom: 'Marseille 6e',   prix_m2_moyen: 3600, nb_transactions: 380, surface_moyenne: 58, prix_median: 210000 },
      '13207': { nom: 'Marseille 7e',   prix_m2_moyen: 4100, nb_transactions: 300, surface_moyenne: 62, prix_median: 260000 },
      '13208': { nom: 'Marseille 8e',   prix_m2_moyen: 4300, nb_transactions: 450, surface_moyenne: 60, prix_median: 270000 },
      '13209': { nom: 'Marseille 9e',   prix_m2_moyen: 3200, nb_transactions: 360, surface_moyenne: 56, prix_median: 185000 },
      '13210': { nom: 'Marseille 10e',  prix_m2_moyen: 2200, nb_transactions: 340, surface_moyenne: 52, prix_median: 115000 },
      '13211': { nom: 'Marseille 11e',  prix_m2_moyen: 2050, nb_transactions: 420, surface_moyenne: 54, prix_median: 110000 },
      '13212': { nom: 'Marseille 12e',  prix_m2_moyen: 2500, nb_transactions: 390, surface_moyenne: 58, prix_median: 145000 },
      '13213': { nom: 'Marseille 13e',  prix_m2_moyen: 2000, nb_transactions: 480, surface_moyenne: 56, prix_median: 112000 },
      '13214': { nom: 'Marseille 14e',  prix_m2_moyen: 1950, nb_transactions: 440, surface_moyenne: 54, prix_median: 105000 },
      '13215': { nom: 'Marseille 15e',  prix_m2_moyen: 1850, nb_transactions: 520, surface_moyenne: 58, prix_median: 108000 },
      '13216': { nom: 'Marseille 16e',  prix_m2_moyen: 2300, nb_transactions: 310, surface_moyenne: 62, prix_median: 145000 }
    };

    // ================================================================
    // 2. VARIABLES GLOBALES
    // ================================================================
    let parcellePoints = {};
    let currentParcelPoints = [];

    // ================================================================
    // 3. CARTE LEAFLET
    // ================================================================
    const map = L.map('map', { center: [43.2965, 5.3698], zoom: 12, zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19
    }).addTo(map);

    let parcelleCluster = null;
    let transactionLayer = null;

    // ================================================================
    // 4. CHARGEMENT ROBUSTE DES DONNÉES (gzip OU JSON brut OU pointeur LFS)
    // ================================================================
    async function fetchJSON(url) {
      console.log(`📥 Chargement : ${url}`);
      try {
        const resp = await fetch(url);
        if (!resp.ok) {
          console.warn(`❌ HTTP ${resp.status} pour ${url}`);
          return null;
        }

        const buffer = await resp.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        const head = bytes.slice(0, 4);

        // Détection du type de fichier
        const isGzip = head[0] === 0x1f && head[1] === 0x8b;
        const isJson = head[0] === 0x7b || head[0] === 0x5b; // '{' ou '['
        const isLfsPointer = !isGzip && !isJson; // probablement un pointeur LFS texte

        // Cas 1 : GZIP → décompression
        if (isGzip) {
          try {
            const ds = new DecompressionStream('gzip');
            const stream = new Blob([bytes]).stream().pipeThrough(ds);
            const text = await new Response(stream).text();
            return JSON.parse(text);
          } catch (e) {
            console.warn('❌ Décompression gzip échouée :', e.message);
            throw new Error('Le fichier gzip est corrompu ou mal servi par le serveur.');
          }
        }

        // Cas 2 : JSON brut → parse direct
        if (isJson) {
          try {
            const text = new TextDecoder().decode(bytes);
            return JSON.parse(text);
          } catch (e) {
            console.warn('❌ Parsing JSON échoué :', e.message);
            return null;
          }
        }

        // Cas 3 : Pointeur LFS → erreur explicite
        if (isLfsPointer) {
          const preview = new TextDecoder().decode(bytes.slice(0, 100));
          console.warn('⚠️ Pointeur LFS détecté :', preview);
          throw new Error(
            'Ce serveur ne sert pas les fichiers Git LFS. ' +
            'Utilise Cloudflare Pages, ou configure CDN_BASE dans index.html.'
          );
        }

        console.warn('❓ Format inconnu :', head);
        return null;
      } catch (e) {
        console.warn(`❌ Erreur pour ${url} :`, e.message);
        throw e;
      }
    }

    function getParcelPoint(feature) {
      const geom = feature.geometry;
      if (!geom) return null;
      if (geom.type === 'Point') {
        const coords = geom.coordinates;
        if (!coords || coords.length < 2) return null;
        return { lat: coords[1], lng: coords[0] };
      } else if (geom.type === 'Polygon') {
        const ring = geom.coordinates[0];
        if (!ring || ring.length === 0) return null;
        let sumLat = 0, sumLng = 0, count = 0;
        ring.forEach(c => { sumLat += c[1]; sumLng += c[0]; count++; });
        return { lat: sumLat / count, lng: sumLng / count };
      } else if (geom.type === 'MultiPolygon') {
        const poly = geom.coordinates[0];
        if (!poly || poly.length === 0) return null;
        const ring = poly[0];
        if (!ring || ring.length === 0) return null;
        let sumLat = 0, sumLng = 0, count = 0;
        ring.forEach(c => { sumLat += c[1]; sumLng += c[0]; count++; });
        return { lat: sumLat / count, lng: sumLng / count };
      }
      return null;
    }

    async function loadParcelles(arrondissement) {
      try {
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('error-msg').style.display = 'none';

        const base = CDN_BASE || 'data';
        const filename = `${base}/cadastre-${arrondissement}-parcelles.json.gz`;

        const data = await fetchJSON(filename);
        if (!data) throw new Error(`Fichier ${filename} introuvable ou invalide.`);

        const points = [];
        data.features.forEach(f => {
          const pt = getParcelPoint(f);
          if (pt) points.push(pt);
        });
        parcellePoints[arrondissement] = points;
        currentParcelPoints = points;
        console.log(`📊 ${points.length} points extraits pour ${arrondissement}`);

        renderParcelles(data);
        document.getElementById('legend-container').style.display = 'block';
        hideLoading();
        return points;
      } catch (err) {
        showError(err.message);
        console.error(err);
        return [];
      }
    }

    // ================================================================
    // 5. RENDU DES PARCELLES (clusters)
    // ================================================================
    function renderParcelles(geojson) {
      if (parcelleCluster) { map.removeLayer(parcelleCluster); parcelleCluster = null; }
      const features = geojson?.features || [];
      document.getElementById('parcelleCount').textContent = features.length;
      if (features.length === 0) {
        parcelleCluster = L.markerClusterGroup({ chunkedLoading: true });
        return;
      }
      parcelleCluster = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: 40,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
      });
      const markers = [];
      features.forEach(f => {
        const pt = getParcelPoint(f);
        if (!pt) return;
        const { lat, lng } = pt;
        if (typeof lat !== 'number' || typeof lng !== 'number' || !isFinite(lat) || !isFinite(lng)) return;
        const icon = L.divIcon({
          html: `<div style="width:10px;height:10px;border-radius:50%;background:#9e9e9e;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
          className: '',
          iconSize: [10,10],
          iconAnchor: [5,5]
        });
        const commune = f.properties.commune || 'Marseille';
        const section = f.properties.section_cadastrale || f.properties.section || '—';
        const numLot = f.properties.num_lot || f.properties.numero || f.properties.lot || '—';
        const surface = formatSurface(f.properties.surface_cadastrale ?? f.properties.contenance);
        const popupContent = `<div>
          <div style="font-weight:700;font-size:1rem;color:#1a3b5d;">${commune}</div>
          <div class="popup-row"><span class="label">📐 Section :</span> <span class="value">${section}</span></div>
          <div class="popup-row"><span class="label">📋 Parcelle :</span> <span class="value">${numLot}</span></div>
          <div class="popup-row"><span class="label">📏 Surface :</span> <span class="value">${surface}</span></div>
        </div>`;
        markers.push(L.marker([lat, lng], { icon }).bindPopup(popupContent, { maxWidth: 260 }));
      });
      parcelleCluster.addLayers(markers);
      map.addLayer(parcelleCluster);
    }

    function formatSurface(value) {
      if (value === undefined || value === null || value === '') return '0 ha';
      if (typeof value === 'number') return (value / 10000).toFixed(2) + ' ha';
      if (typeof value === 'string') {
        const m = value.match(/(\d+)ha\s*(\d+)a\s*(\d+)ca/);
        if (m) {
          const ha = parseInt(m[1]) || 0;
          const a = parseInt(m[2]) || 0;
          const ca = parseInt(m[3]) || 0;
          return (ha + a/100 + ca/10000).toFixed(2) + ' ha';
        }
        const num = parseFloat(value);
        if (!isNaN(num)) return (num / 10000).toFixed(2) + ' ha';
        return value;
      }
      return '0 ha';
    }

    // ================================================================
    // 6. GÉNÉRATION DES TRANSACTIONS
    // ================================================================
    function generateTransactionsForArrondissement(code) {
      const stat = STATS_ARRONDISSEMENTS[code];
      if (!stat) return [];
      const points = parcellePoints[code] || [];
      if (points.length === 0) return [];

      const nb = Math.min(stat.nb_transactions, points.length);
      const shuffled = [...points].sort(() => Math.random() - 0.5);
      const selectedPoints = shuffled.slice(0, nb);

      const transactions = [];
      selectedPoints.forEach(pt => {
        const surface = Math.round(stat.surface_moyenne * (0.5 + Math.random()));
        const prix_m2 = Math.round(stat.prix_m2_moyen * (0.7 + 0.6 * Math.random()));
        const prix = prix_m2 * surface;
        transactions.push({
          code_commune: code,
          arrondissement: stat.nom,
          lat: pt.lat,
          lng: pt.lng,
          surface,
          prix,
          prix_m2,
          type_local: Math.random() > 0.3 ? 'Appartement' : 'Maison'
        });
      });
      return transactions;
    }

    // ================================================================
    // 7. AFFICHAGE DES TRANSACTIONS
    // ================================================================
    let transactionLayerGroup = null;

    function renderTransactions(filterCode) {
      if (transactionLayerGroup) {
        map.removeLayer(transactionLayerGroup);
        transactionLayerGroup = null;
      }

      let allTransactions = [];
      if (filterCode === 'all') {
        Object.keys(STATS_ARRONDISSEMENTS).forEach(code => {
          allTransactions = allTransactions.concat(generateTransactionsForArrondissement(code));
        });
      } else {
        allTransactions = generateTransactionsForArrondissement(filterCode);
      }

      if (allTransactions.length === 0) return;

      const markers = [];
      allTransactions.forEach(t => {
        const icon = L.divIcon({
          html: `<div style="width:12px;height:12px;border-radius:50%;background:#e74c3c;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
          className: '',
          iconSize: [12,12],
          iconAnchor: [6,6]
        });
        const popup = `<div>
          <div style="font-weight:700;font-size:1rem;color:#1a3b5d;">${t.arrondissement}</div>
          <div class="popup-row"><span class="label">Type :</span> <span class="value">${t.type_local}</span></div>
          <div class="popup-row"><span class="label">Surface :</span> <span class="value">${t.surface} m²</span></div>
          <div class="popup-row"><span class="label">Prix :</span> <span class="value">${t.prix.toLocaleString()} €</span></div>
          <div class="popup-row"><span class="label">Prix / m² :</span> <span class="value">${t.prix_m2.toLocaleString()} €</span></div>
        </div>`;
        markers.push(L.marker([t.lat, t.lng], { icon }).bindPopup(popup));
      });

      transactionLayerGroup = L.layerGroup(markers);
      map.addLayer(transactionLayerGroup);
    }

    // ================================================================
    // 8. KPIs
    // ================================================================
    function updateDashboard(filterCode) {
      let stats = null;
      if (filterCode === 'all') {
        const codes = Object.keys(STATS_ARRONDISSEMENTS);
        let totalPrixM2 = 0, totalSurf = 0, totalPrix = 0, totalCount = 0;
        codes.forEach(code => {
          const s = STATS_ARRONDISSEMENTS[code];
          totalPrixM2 += s.prix_m2_moyen * s.nb_transactions;
          totalSurf += s.surface_moyenne * s.nb_transactions;
          totalPrix += s.prix_median * s.nb_transactions;
          totalCount += s.nb_transactions;
        });
        stats = {
          prix_m2_moyen: totalCount ? totalPrixM2 / totalCount : 0,
          surface_moyenne: totalCount ? totalSurf / totalCount : 0,
          prix_median: totalCount ? totalPrix / totalCount : 0,
          nb_transactions: totalCount
        };
      } else {
        stats = STATS_ARRONDISSEMENTS[filterCode];
      }

      if (!stats) return;

      document.getElementById('kpi-panel').style.display = 'grid';
      document.getElementById('kpi-prix-m2').textContent = Math.round(stats.prix_m2_moyen).toLocaleString() + ' €';
      document.getElementById('kpi-transactions').textContent = stats.nb_transactions.toLocaleString();
      document.getElementById('kpi-surface').textContent = Math.round(stats.surface_moyenne) + ' m²';
      document.getElementById('kpi-prix-median').textContent = Math.round(stats.prix_median).toLocaleString() + ' €';

      updateChart(filterCode);
    }

    // ================================================================
    // 9. GRAPHIQUE
    // ================================================================
    let chartInstance = null;

    function updateChart(filterCode) {
      const canvas = document.getElementById('chart-prix-m2');
      const ctx = canvas.getContext('2d');
      if (chartInstance) { chartInstance.destroy(); }

      let labels, data, title;
      if (filterCode === 'all') {
        const codes = Object.keys(STATS_ARRONDISSEMENTS);
        labels = codes.map(c => STATS_ARRONDISSEMENTS[c].nom);
        data = codes.map(c => Math.round(STATS_ARRONDISSEMENTS[c].prix_m2_moyen));
        title = '📊 Prix au m² par arrondissement (Marseille)';
      } else {
        const txs = generateTransactionsForArrondissement(filterCode);
        if (txs.length === 0) return;
        const prices = txs.map(t => t.prix_m2).sort((a,b) => a-b);
        const bins = 10;
        const min = Math.floor(prices[0] / 100) * 100;
        const max = Math.ceil(prices[prices.length-1] / 100) * 100;
        const step = (max - min) / bins;
        const counts = new Array(bins).fill(0);
        const binLabels = [];
        for (let i = 0; i < bins; i++) {
          const low = min + i * step;
          const high = min + (i+1) * step;
          binLabels.push(`${Math.round(low)}-${Math.round(high)} €`);
          prices.forEach(p => { if (p >= low && p < high) counts[i]++; });
        }
        labels = binLabels;
        data = counts;
        title = `📊 Prix au m² - ${STATS_ARRONDISSEMENTS[filterCode].nom}`;
      }

      document.getElementById('graph-panel').style.display = 'block';
      document.getElementById('graph-title').textContent = title;

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Prix / m² (€)',
            data: data,
            backgroundColor: 'rgba(42, 111, 151, 0.6)',
            borderColor: 'rgba(42, 111, 151, 1)',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { callback: v => v + ' €' } } }
        }
      });
    }

    // ================================================================
    // 10. ERREURS / LOADING
    // ================================================================
    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.innerHTML = '⚠️ ' + msg;
      el.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
    }
    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }

    // ================================================================
    // 11. ÉVÉNEMENTS
    // ================================================================
    document.getElementById('arrSelect').addEventListener('change', async function(e) {
      const val = e.target.value;
      const loading = document.getElementById('loading');
      loading.style.display = 'flex';
      document.getElementById('error-msg').style.display = 'none';

      if (val === 'all') {
        await loadParcelles('13201');
        renderTransactions('all');
        updateDashboard('all');
      } else {
        await loadParcelles(val);
        renderTransactions(val);
        updateDashboard(val);
      }
      loading.style.display = 'none';
    });

    // ================================================================
    // 12. INIT
    // ================================================================
    (async function init() {
      document.getElementById('arrSelect').value = '13201';
      await loadParcelles('13201');
      renderTransactions('13201');
      updateDashboard('13201');
      setTimeout(() => {
        document.getElementById('legend-container').style.display = 'block';
      }, 1500);
    })();
  </script>
</body>
</html>
